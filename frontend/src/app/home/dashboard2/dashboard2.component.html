<form #chartForm="ngForm" [formGroup]="chartInformationForm" (keydown.enter)="$event.preventDefault()"
  class="full-height ">
  <ul class="nav nav-pills mb-3 border-bottom border-secondary" id="pills-tab" role="tablist">
    <li class="nav-item">
      <a class="nav-link active" id="" data-toggle="pill" href="#pills-new" role="tab" aria-controls="pills-home"
        aria-selected="true">HighChart</a>
    </li>
  </ul>
  <div class="row">
    <div class="col-lg-4">
      <div class="form-group row">
        <label for="" class="col-sm-3 col-form-label pr-0 text-right">Name 
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-9">
          <ng-select placeholder="-- Select --" [items]="empNames" bindLabel="firstName"
            [(ngModel)]="selectedEmployeeName" formControlName="firstName" (change)="onEmployeeSelected($event)">
          </ng-select>
          <div *ngIf="chartInformationForm.get('firstName')?.touched" class="error-msg-common text-danger">
            <div *ngIf="chartInformationForm.get('firstName').errors?.required">
              * required field
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="form-group row">
        <label for="" id="addItemSupplierLabelValidityItemSupplier" class="col-sm-3 col-form-label pr-0 text-right">From
          Date
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" formControlName="startDate" (change)="onSelectedStartDate($event)"
            [(ngModel)]="startDate" />
          <div *ngIf="chartInformationForm.get('startDate')?.touched" class="error-msg-common text-danger">
            <div *ngIf="chartInformationForm.get('startDate').errors?.required">
              * required field
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="form-group row">
        <label for="" id="addItemSupplierLabelValidityItemSupplier" class="col-sm-3 col-form-label pr-0 text-right">To
          Date
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-9">
          <input type="date" class="form-control" formControlName="endDate"  disabled/>
          <div *ngIf="chartInformationForm.get('endDate')?.touched" class="error-msg-common text-danger">
            <div *ngIf="chartInformationForm.get('endDate').errors?.required">
              * required field
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-4">
      <div class="form-group row">
        <label for="" class="col-sm-3 col-form-label pr-0 text-right">Period </label>
        <div class="col-sm-9">
          <ng-select placeholder="-- Select --" [items]="periodData" bindLabel="period" [(ngModel)]="selectedPeriod"
            formControlName="period" (change)="onPeriodSelected($event)">
          </ng-select>
          <div *ngIf="chartInformationForm.get('period')?.touched" class="error-msg-common text-danger">
            <div *ngIf="chartInformationForm.get('period').errors?.required">
              * required field
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col mb-3 pt-2 text-center">
      <button class="btn btn-primary px-4" id="mu-adduser-save" (click)="onGenerateChart()"
        [disabled]="checkFormDisability()">Generate Chart</button>
      <input type="button" value="Cancel" class="btn btn-secondary px-4 ml-3" (click)="onCancel()"
        id="mu-adduser-cancel">
    </div>
  </div>
</form>

<div id="chart">
  <highcharts-chart [Highcharts]="Highcharts" [constructorType]="chartConstructor" [options]="chartOptions"
    [callbackFunction]="chartCallback" [(update)]="updateFlag" [oneToOne]="oneToOneFlag"
    [runOutsideAngular]="runOutsideAngularFlag" style="display: block; margin-left: 280px; height: 350px;">
  </highcharts-chart>
</div>
<ng4-loading-spinner [loadingText]="'Please wait...'" [timeout]="400000000"> </ng4-loading-spinner>
