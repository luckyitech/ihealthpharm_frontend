<div id="editCOAGrid" class="row pt-3 pl-3">
    <div class="row col-lg-10">
        <div class="col-lg-3">
            <div class="form-group row">

                <div class="col-sm-12">
                    <input type="date" placeholder="From Txn Date" class="form-control" id="" [(ngModel)]="fromTxnDate">
                </div>

            </div>
        </div>
        <div class="col-lg-3">
            <div class="form-group row">


                <div class="col-sm-12">
                    <input type="date" placeholder="To Txn Date" class="form-control" id="" [(ngModel)]="toTxnDate">
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="form-group row">

                <div class="col-sm-12">
                    <input type="text" placeholder="Txn Ref No" class="form-control" id=""
                        [(ngModel)]="transactionRefNo">
                </div>
            </div>
        </div>

        <div class="col-lg-1">
            <div class="form-group row">
                <div class="col-sm-12">
                    <button class="btn btn-primary" (click)="getTransactionsBySearch()">Search</button>
                </div>
            </div>
        </div>

    </div>

    <!-- <div class="col text-right">
        <button class="btn btn-primary px-4 edit-btn"
            [disabled]="pettyCashGridOptions?.api?.getSelectedRows()?.length === 0" id="common-grid-btn"
            (click)="editGrid()">Edit</button>

    </div> -->

    <div class="row col-lg-12">
        <div class="col-lg-5">
            <div class="form-group row">
                <div class="col-sm-12">
                    <ng-select placeholder="-- Select Party --" [items]="accountNames" bindLabel="accountName"
                        [(ngModel)]="selectedSearchParty" (clear)="onSearchPartyClear()">
                    </ng-select>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="form-group row">
                <div class="col-sm-12">
                    <ng-select placeholder="-- Select Counter Party --" [items]="accountNames" bindLabel="accountName"
                        [(ngModel)]="selectedSearchCounterParty" (clear)="onSearchCounterPartyClear()">
                    </ng-select>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="row grid-area">
    <div class="col py-3">
        <ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-balham"
            [gridOptions]='pettyCashGridOptions' (cellClicked)='onCellClicked($event)' [pagination]="true"
            [cacheOverflowSize]="gridCacheOverFlowSize"
            [maxConcurrentDatasourceRequests]="txnMaxConcurrentDatasourceRequests"
            [paginationPageSize]="txnEditPaginationSize">
        </ag-grid-angular>

    </div>
</div>
<div class="editCOAInformationForm" id="Account-Information" style="display: none;">
    <form #newPettyCashForm="ngForm" [formGroup]="newPettyCashInformationForm" (keydown.enter)="$event.preventDefault()"
        class="full-height ">

        <h6 class="border border-primary p-2 mt-3 mb-4 bg-light text-white">New Petty Cash</h6>

        <div class="row">
            <div class="col-lg-4">
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="pettyCashRefNo">PettyCash Ref No
                    </label>
                    <div class="col-sm-9">
                        <input formControlName="pettyCashRef" type="text" class="form-control" id="pettyCashRefNo"
                            placeholder="" [(ngModel)]="pettyCashRefNumber" disabled>

                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="pettyCashDateLabel">Date
                    </label>
                    <div class="col-sm-9">
                        <input formControlName="date" type="text" class="form-control" id="pettyCashDate" placeholder=""
                            disabled>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="fromAccountIdLabel">Party
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <ng-select placeholder="-- select --" [items]="accountNames" bindLabel="accountName"
                            [(ngModel)]="selectedParty" formControlName="partyNo" (clear)="onPartyClear()"
                            (change)="onPartySelected($event)">
                        </ng-select>
                        <div *ngIf="newPettyCashInformationForm.get('partyNo')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="newPettyCashInformationForm.get('partyNo').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="ToAccountIdLabel">Counter Party
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <ng-select placeholder="-- select --" [items]="counterPartyAccountNames" bindLabel="accountName"
                            [(ngModel)]="selectedCounterParty" formControlName="counterPartyNo" (clear)="onClear()"
                            (change)="oncounterPartySelected($event)">
                        </ng-select>
                        <div *ngIf="newPettyCashInformationForm.get('counterPartyNo')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="newPettyCashInformationForm.get('counterPartyNo').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="referenceLabelId">Reference
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="reference" type="text" class="form-control" id="referenceId"
                            placeholder="Reason">
                        <div *ngIf="newPettyCashInformationForm.get('reference')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="newPettyCashInformationForm.get('reference').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group row">

                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="balanceLabelId">Current Balance
                    </label>
                    <div class="col-sm-9">
                        <input formControlName="balance" type="text" class="form-control" id="balanceId"
                            placeholder="Available Balance" disabled>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="amountLabelId">Amount
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="amount" type="text" class="form-control" id="amountId"
                            (keyup)="onAmountSelected($event)" placeholder="Enter PettyCash Amount">
                        <div *ngIf="newPettyCashInformationForm.get('amount')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="newPettyCashInformationForm.get('amount').errors?.required">
                                * required field
                            </div>
                        </div>
                        <div *ngIf="newPettyCashInformationForm.get('amount')?.invalid"
                            class="error-msg-common text-danger">
                            <div
                                *ngIf="!newPettyCashInformationForm.get('amount').errors?.required && newPettyCashInformationForm?.get('amount')?.errors">
                                * not a valid input
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="expensesReasonLabel">Reason
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <textarea type="text" id="ExpensesAddReason" formControlName="reason"
                            class="form-control"></textarea>
                        <div *ngIf="newPettyCashInformationForm.get('reason')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="newPettyCashInformationForm.get('reason').errors?.required">
                                * required field
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="row pt-4">
            <div class="col mb-3 pt-2 text-center">
                <button (click)="onPettyCashSubmit()" class="btn btn-primary px-4" [disabled]="checkFormDisability()"
                    id="mu-adduser-save">Save</button>
                <input type="button" class="btn btn-secondary px-4 ml-3" (click)="reset()" id="mu-adduser-cancel"
                    value="Cancel">
            </div>
        </div>
    </form>
</div>


<div class="modal fade" id="approvedModal" tabindex="-1" role="dialog" aria-labelledby="pendingLabel">
    <div class="modal-dialog modal-lg" role="document">

        <div class="module_box loginBox__shadow rhythmMargin1 col-10 col-md-08" id="nav-tab"
            role="tablist">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">PettyCash Details</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">

                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-home" role="tabpanel"
                            aria-labelledby="pills-home-tab">
                            <form #viewPettyCashForm="ngForm" [formGroup]="viewPettyCashInformationForm"

                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"

                                            </label>
                                            <div class="col-sm-9">
                                                <input formControlName="pettyCashRef" type="text" class="form-control"
                                                    id="pettyCashRefNo" placeholder="" [(ngModel)]="pettyCashRefNumber"
                                                    disabled>

                                            </div>
                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="pettyCashDateLabel">Date
                                            </label>
                                            <div class="col-sm-9">
                                                <input formControlName="date" type="text" class="form-control"
                                                    id="pettyCashDate" placeholder="" disabled>
                                            </div>
                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="fromAccountIdLabel">Party
                                            </label>
                                            <div class="col-sm-9">
                                                <ng-select placeholder="-- select --" [items]="accountNames"
                                                    bindLabel="accountName" [(ngModel)]="selectedParty"
                                                    formControlName="partyNo" (clear)="onPartyClear()"
                                                    (change)="onPartySelected($event)">
                                                </ng-select>

                                            </div>
                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="ToAccountIdLabel">Counter Party
                                            </label>
                                            <div class="col-sm-9">
                                                <ng-select placeholder="-- select --" [items]="counterPartyAccountNames"
                                                    bindLabel="accountName" [(ngModel)]="selectedCounterParty"
                                                    formControlName="counterPartyNo" (clear)="onClear()"
                                                    (change)="oncounterPartySelected($event)">
                                                </ng-select>

                                            </div>
                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="referenceLabelId">Reference
                                            </label>
                                            <div class="col-sm-9">
                                                <input formControlName="reference" type="text" class="form-control"
                                                    id="referenceId" placeholder="Reason" disabled>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-6">
                                        <div class="form-group row">

                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="balanceLabelId">Current Balance
                                            </label>
                                            <div class="col-sm-9">
                                                <input formControlName="balance" type="text" class="form-control"
                                                    id="balanceId" placeholder="Available Balance" disabled>
                                            </div>
                                        </div>
                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="amountLabelId">Amount
                                            </label>
                                            <div class="col-sm-9">
                                                <input formControlName="amount" type="text" class="form-control"
                                                    id="amountId" (keyup)="onAmountSelected($event)"
                                                    placeholder="Enter PettyCash Amount" disabled>


                                            </div>
                                        </div>

                                        <div class="form-group row">
                                            <label for="" class="col-sm-3 col-form-label pr-0 text-right"
                                                id="expensesReasonLabel">Reason
                                            </label>
                                            <div class="col-sm-9">
                                                <textarea type="text" id="ExpensesAddReason" formControlName="reason"
                                                    class="form-control" disabled></textarea>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row pt-4">
                                    <div class="col mb-3 pt-2 text-center">
                                        <input type="button" class="btn btn-secondary px-4 ml-3" (click)="cancelForm()"
                                            id="mu-adduser-cancel" value="Cancel">
                                    </div>
                                </div>
                            </form>


                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
<ng4-loading-spinner [loadingText]="'Please wait...'" [timeout]="400000000"> </ng4-loading-spinner>
