<form #chartOfAccountsForm="ngForm" [formGroup]="COAInformationForm" (keydown.enter)="$event.preventDefault()"
    class="full-height ">

    <h6 class="border border-primary p-2 mt-3 mb-4 bg-light text-white">Create New Account</h6>

    <div class="row">
        <div class="col-lg-4">

            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="COADateLabel">Date</label>
                <div class="col-sm-9">
                    <input formControlName="date" type="text" class="form-control" id="COADate" placeholder="" disabled>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="COAAccountNoLabel">Account No
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="accountNo" type="text" class="form-control" id="accountNoId"
                        placeholder="Enter Account No">
                    <div *ngIf="COAInformationForm.get('accountNo')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('accountNo').errors?.required">
                            * required field
                        </div>
                    </div>
                    <div *ngIf="COAInformationForm.get('accountNo')?.invalid" class="error-msg-common text-danger">
                        <div
                            *ngIf="!COAInformationForm.get('accountNo').errors?.required && COAInformationForm?.get('accountNo')?.errors">
                            * not a valid input
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="accountNameLabel">Account Name
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="accountName" type="text" class="form-control" id="accountNameId"
                        placeholder="Enter Account Name">
                    <div *ngIf="COAInformationForm.get('accountName')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('accountName').errors?.required">
                            * required field
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="transactionLimitLabel">Transaction
                    Limit
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="transactionLimit" type="text"
                        class="form-control" id="transactionLimitId" placeholder="Enter txn limit">
                    <div *ngIf="COAInformationForm.get('transactionLimit')?.touched"
                        class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('transactionLimit').errors?.required">
                            * required field
                        </div>
                    </div>
                    <div *ngIf="COAInformationForm.get('transactionLimit')?.invalid"
                        class="error-msg-common text-danger">
                        <div
                            *ngIf="!COAInformationForm.get('transactionLimit').errors?.required && COAInformationForm?.get('transactionLimit')?.errors">
                            * not a valid input
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="accountTypeLabel">Account Type
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <ng-select placeholder="-- select --" [items]="accountTypes" bindLabel="accountType"
                        [(ngModel)]="selectedAccountType" formControlName="accountType"
                        (change)="onAccountTypeSelected($event)">
                    </ng-select>
                    <div *ngIf="COAInformationForm.get('accountType')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('accountType').errors?.required">
                            * required field
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="currentBalanceLabel">Balance
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="currentBalance" type="text" class="form-control"
                        id="currentBalanceId" placeholder="Enter Balance">
                    <div *ngIf="COAInformationForm.get('currentBalance')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('currentBalance').errors?.required">
                            * required field
                        </div>
                    </div>
                    <div *ngIf="COAInformationForm.get('currentBalance')?.invalid" class="error-msg-common text-danger">
                        <div
                            *ngIf="!COAInformationForm.get('currentBalance').errors?.required && COAInformationForm?.get('currentBalance')?.errors">
                            * not a valid input
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="asOfDateLabel">As Of Date
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="asOfDate" type="date" class="form-control" id="asOfDateId" placeholder="">
                    <div *ngIf="COAInformationForm.get('asOfDate')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('asOfDate').errors?.required">
                            * required field
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="totalLimitLabel">Total
                    Limit
                    <span class="text-danger">*</span></label>
                <div class="col-sm-9">
                    <input formControlName="totalLimit" type="text" class="form-control"
                        id="totalLimitId" placeholder="Enter total limit">
                    <div *ngIf="COAInformationForm.get('totalLimit')?.touched" class="error-msg-common text-danger">
                        <div *ngIf="COAInformationForm.get('totalLimit').errors?.required">
                            * required field
                        </div>
                    </div>
                    <div *ngIf="COAInformationForm.get('totalLimit')?.invalid" class="error-msg-common text-danger">
                        <div
                            *ngIf="!COAInformationForm.get('totalLimit').errors?.required && COAInformationForm?.get('totalLimit')?.errors">
                            * not a valid input
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row pt-4">
        <div class="col mb-3 pt-2 text-center">
            <button (click)="onCOASubmit()" class="btn btn-primary px-4" [disabled]="checkFormDisability()"
                id="mu-adduser-save">Save</button>
            <input type="button" class="btn btn-secondary px-4 ml-3" (click)="reset()" id="mu-adduser-cancel"
                value="Cancel">
        </div>
    </div>
</form>
<ng4-loading-spinner [loadingText]="'Please wait...'" [timeout]="400000000"> </ng4-loading-spinner>
