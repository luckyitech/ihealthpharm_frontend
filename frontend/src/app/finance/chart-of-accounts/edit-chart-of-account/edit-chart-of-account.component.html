<div id="editCOAGrid" class="row pt-3">
    <div class="col">
        <form class="form-inline">
            <input class="form-control no-right-border-radius" type="text" placeholder="Account No" aria-label="Search"
                [(ngModel)]="key" [ngModelOptions]="{standalone:true}">
            <button class="btn btn-primary no-left-border-radius" (click)="search()">Search</button>
        </form>
    </div>
    <div class="col text-right">
        <button class="btn btn-primary px-4 edit-btn" [disabled]="COAGridOptions?.api?.getSelectedRows()?.length === 0"
            id="common-grid-btn" (click)="editGrid()">Edit</button>

    </div>
</div>

<div class="row grid-area">
    <div class="col py-3">
        <ag-grid-angular id="common-grid" style="width: 100%; height: 620px;" class="ag-theme-balham"
            [rowData]="rowData" [gridOptions]="COAGridOptions" [columnDefs]="columnDefs" [singleClickEdit]="true">
        </ag-grid-angular>

    </div>
</div>
<div class="editCOAInformationForm" id="Account-Information" style="display: none;">
    <form #chartOfAccountsForm="ngForm" [formGroup]="editCOAInformationForm" (keydown.enter)="$event.preventDefault()"
        class="full-height ">

        <h6 class="border border-primary p-2 mt-3 mb-4 bg-light text-white">Edit Account</h6>

        <div class="row">
            <div class="col-lg-4">

                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="COADateLabel">Date</label>
                    <div class="col-sm-9">
                        <input formControlName="date" type="text" class="form-control" id="COADate" placeholder=""
                            disabled>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="COAAccountNoLabel">Account No
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="accountNo" type="text" class="form-control" id="accountNoId"
                            placeholder="">
                        <div *ngIf="editCOAInformationForm.get('accountNo')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('accountNo').errors?.required">
                                * required field
                            </div>
                        </div>
                        <div *ngIf="editCOAInformationForm.get('accountNo')?.invalid"
                            class="error-msg-common text-danger">
                            <div
                                *ngIf="!editCOAInformationForm.get('accountNo').errors?.required && editCOAInformationForm?.get('accountNo')?.errors">
                                * not a valid input
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="accountNameLabel">Account Name
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="accountName" type="text" class="form-control" id="accountNameId"
                            placeholder="">
                        <div *ngIf="editCOAInformationForm.get('accountName')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('accountName').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="transactionLimitLabel">Transaction
                        Limit
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="transactionLimit" type="text" class="form-control"
                            id="transactionLimitId" placeholder="">
                        <div *ngIf="editCOAInformationForm.get('transactionLimit')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('transactionLimit').errors?.required">
                                * required field
                            </div>
                        </div>
                        <div *ngIf="editCOAInformationForm.get('transactionLimit')?.invalid"
                            class="error-msg-common text-danger">
                            <div
                                *ngIf="!editCOAInformationForm.get('transactionLimit').errors?.required && editCOAInformationForm?.get('transactionLimit')?.errors">
                                * not a valid input
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="accountTypeLabel">Account Type
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <ng-select placeholder="-- select --" [items]="accountTypes" bindLabel="accountType" id="accountTypeId"
                            [(ngModel)]="selectedAccountType" formControlName="accountType">
                        </ng-select>
                        <div *ngIf="editCOAInformationForm.get('accountType')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('accountType').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="currentBalanceLabel">Current
                        Balance
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="currentBalance" type="text" class="form-control" id="currentBalanceId"
                            placeholder="">
                        <div *ngIf="editCOAInformationForm.get('currentBalance')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('currentBalance').errors?.required">
                                * required field
                            </div>
                        </div>
                        <div *ngIf="editCOAInformationForm.get('currentBalance')?.invalid"
                            class="error-msg-common text-danger">
                            <div
                                *ngIf="!editCOAInformationForm.get('currentBalance').errors?.required && editCOAInformationForm?.get('currentBalance')?.errors">
                                * not a valid input
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="asOfDateLabel">As Of Date
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="asOfDate" type="date" class="form-control" id="asOfDateId"
                            placeholder="">
                        <div *ngIf="editCOAInformationForm.get('asOfDate')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('asOfDate').errors?.required">
                                * required field
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="" class="col-sm-3 col-form-label pr-0 text-right" id="totalLimitLabel">Total
                        Limit
                        <span class="text-danger">*</span></label>
                    <div class="col-sm-9">
                        <input formControlName="totalLimit" type="text" class="form-control" id="totalLimitId"
                            placeholder="">
                        <div *ngIf="editCOAInformationForm.get('totalLimit')?.touched"
                            class="error-msg-common text-danger">
                            <div *ngIf="editCOAInformationForm.get('totalLimit').errors?.required">
                                * required field
                            </div>
                        </div>
                        <div *ngIf="editCOAInformationForm.get('totalLimit')?.invalid"
                            class="error-msg-common text-danger">
                            <div
                                *ngIf="!editCOAInformationForm.get('totalLimit').errors?.required && editCOAInformationForm?.get('totalLimit')?.errors">
                                * not a valid input
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row pt-4">
            <div class="col mb-3 pt-2 text-center">
                <button (click)="onEditCOASubmit()" class="btn btn-primary px-4" [disabled]="checkFormDisability() || coaButtonSubmitDisable"
                    id="mu-adduser-save">Save</button>
                <input type="button" class="btn btn-secondary px-4 ml-3" (click)="reset()" id="mu-adduser-cancel"
                    value="Cancel">
            </div>
        </div>
    </form>
</div>
<ng4-loading-spinner [loadingText]="'Please wait...'" [timeout]="400000000"> </ng4-loading-spinner>
